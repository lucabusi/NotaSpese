# Builds an installable test APK on every push to main (and on demand).
# Needed because the local dev machine has no Android SDK / JDK 17
# (see gotcha in CLAUDE.md): CI is the only build path for now.
# The release APK is signed with the debug key (build.gradle.kts default),
# fine for manual sideloading, NOT for Play Store.
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # keep in sync with local `flutter --version`
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nota-spese-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
