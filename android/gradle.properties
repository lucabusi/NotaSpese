org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# [FIX R8] ML Kit (document_scanner + text_recognizer) va in NullPointerException
# a runtime SOLO nelle build release: R8 full mode (default AGP 8+) ottimizza in
# modo troppo aggressivo le classi interne mlkit_common (zzsr) su cui i plugin
# Flutter fanno affidamento. In debug non c'è minificazione, quindi lo scanner
# automatico e l'OCR funzionano; in release fallivano in silenzio (catch (_) →
# fotocamera semplice + testo vuoto). Full mode off ripristina il comportamento.
android.enableR8.fullMode=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
